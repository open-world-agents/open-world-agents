[project]
name = "owa"
version = "0.6.6"
description = "Everything you need to build state-of-the-art foundation multimodal desktop agent, end-to-end."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcap-owa-support==0.6.6",
    "owa-cli==0.6.6",
    "owa-core==0.6.6",
    "owa-env-desktop==0.6.6",
    "owa-env-gst==0.6.6",
    "owa-msgs==0.6.6",
]

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-mermaid2-plugin",
    "mkdocs-redirects",
    "mkdocstrings-owa",
    "mkdocs-click",
    "termynal",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ipython",
    "pytest",
    "pytest-cov",
    "pytest-subtests",
    "pytest-timeout",
    "ruff",
    "virtual-uv",
]

[tool.uv]
exclude-newer = "2026-07-24T00:00:00Z"
# https://github.com/pygobject/pygobject-stubs/issues/273
override-dependencies = ["pygobject; sys_platform == 'never'"]

[tool.uv.sources]
mcap-owa-support = { path = "projects/mcap-owa-support", editable = true }
owa-cli = { path = "projects/owa-cli", editable = true }
owa-core = { path = "projects/owa-core", editable = true }
owa-env-desktop = { path = "projects/owa-env-desktop", editable = true }
owa-env-gst = { path = "projects/owa-env-gst", editable = true }
owa-msgs = { path = "projects/owa-msgs", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.coverage.run]
source = ["projects"]
branch = true
relative_files = true
context = "${CONTEXT}"
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    'pragma: no cover',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    'if typing.TYPE_CHECKING:',
    '@overload',
    '@typing.overload',
    '\(Protocol\):$',
    'typing.assert_never',
    'assert_never',
]

[tool.coverage.paths]
source = [
    "projects/",
    "/home/runner/work/open-world-agents/open-world-agents/projects/",
    "D:\\a\\open-world-agents\\open-world-agents\\projects\\",
]

[tool.coverage.html]
directory = "htmlcov"
